<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ShopCart — E-Commerce Store</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>

<nav>
  <div class="nav-logo">Shop<span>Cart</span></div>
  <div class="nav-links">
    <a href="#">Products</a>
    <a href="#">Deals</a>
    <a href="#">About</a>
    <button class="cart-btn" onclick="toggleCart()">🛒<span class="cart-count" id="cartCount">0</span></button>
  </div>
</nav>

<div class="hero-banner">
  <div class="hero-text">
    <h1>Shop the Latest<br><span>Tech & Lifestyle</span></h1>
    <p>Free delivery on orders above $50.<br>New arrivals every week.</p>
    <button class="shop-btn" onclick="document.querySelector('.products-wrap').scrollIntoView({behavior:'smooth'})">Shop Now →</button>
  </div>
  <div class="hero-img">🛍️</div>
</div>

<div class="category-bar" id="categoryBar"></div>

<div class="products-wrap">
  <div class="section-title" id="sectionTitle">All Products</div>
  <div class="products-grid" id="productsGrid"></div>
</div>

<div class="overlay" id="overlay" onclick="closeCart()"></div>
<div class="cart-panel" id="cartPanel">
  <div class="cart-header"><h2>🛒 Your Cart</h2><button class="close-cart" onclick="closeCart()">✕</button></div>
  <div class="cart-items" id="cartItems"></div>
  <div class="cart-footer" id="cartFooter"></div>
</div>

<div class="toast" id="toast"></div>


<script src="script.js"></script>
</body>
</html>
