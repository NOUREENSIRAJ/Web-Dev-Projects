<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ShopCart — E-Commerce Store</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Inter',sans-serif;background:#F9FAFB;color:#111827;font-size:15px}
nav{background:#fff;border-bottom:1px solid #E5E7EB;padding:0 2rem;height:64px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:100}
.nav-logo{font-weight:800;font-size:22px;color:#111827}
.nav-logo span{color:#F97316}
.nav-links{display:flex;gap:1.5rem;align-items:center}
.nav-links a{text-decoration:none;color:#6B7280;font-size:14px;font-weight:500}
.cart-btn{position:relative;background:none;border:none;cursor:pointer;font-size:22px}
.cart-count{position:absolute;top:-6px;right:-8px;background:#F97316;color:#fff;font-size:10px;font-weight:700;width:18px;height:18px;border-radius:50%;display:flex;align-items:center;justify-content:center}
.hero-banner{background:linear-gradient(135deg,#111827 0%,#1F2937 100%);padding:3rem 2rem;display:flex;align-items:center;justify-content:space-between;max-width:100%}
.hero-text h1{font-size:36px;font-weight:800;color:#fff;margin-bottom:0.75rem;line-height:1.2}
.hero-text h1 span{color:#F97316}
.hero-text p{color:#9CA3AF;margin-bottom:1.5rem;font-size:15px}
.shop-btn{background:#F97316;color:#fff;border:none;padding:12px 28px;border-radius:10px;font-size:15px;font-weight:700;cursor:pointer}
.hero-img{font-size:120px;opacity:0.9}
.category-bar{display:flex;gap:10px;padding:1.25rem 2rem;background:#fff;border-bottom:1px solid #E5E7EB;overflow-x:auto}
.cat-btn{background:#F3F4F6;color:#374151;border:none;padding:7px 18px;border-radius:20px;font-size:13px;font-weight:500;cursor:pointer;white-space:nowrap;transition:all 0.2s}
.cat-btn.active,.cat-btn:hover{background:#F97316;color:#fff}
.section-title{font-size:22px;font-weight:700;color:#111827;margin-bottom:1.5rem}
.products-wrap{max-width:1200px;margin:0 auto;padding:2rem}
.products-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:1.25rem}
.product-card{background:#fff;border:1px solid #E5E7EB;border-radius:14px;overflow:hidden;transition:all 0.2s;cursor:pointer}
.product-card:hover{box-shadow:0 8px 24px rgba(0,0,0,0.1);transform:translateY(-3px)}
.product-img{height:180px;display:flex;align-items:center;justify-content:center;font-size:72px;position:relative}
.badge{position:absolute;top:10px;left:10px;font-size:11px;font-weight:700;padding:3px 10px;border-radius:20px}
.badge-sale{background:#FEE2E2;color:#DC2626}
.badge-new{background:#DCFCE7;color:#16A34A}
.product-info{padding:1rem}
.product-name{font-size:14px;font-weight:600;color:#111827;margin-bottom:4px}
.product-cat{font-size:12px;color:#9CA3AF;margin-bottom:8px}
.product-price-row{display:flex;align-items:center;gap:8px;margin-bottom:10px}
.price{font-size:18px;font-weight:700;color:#F97316}
.old-price{font-size:13px;color:#9CA3AF;text-decoration:line-through}
.stars{font-size:12px;color:#F59E0B;margin-bottom:10px}
.add-to-cart{width:100%;background:#111827;color:#fff;border:none;padding:9px;border-radius:8px;font-size:13px;font-weight:600;cursor:pointer;transition:background 0.2s}
.add-to-cart:hover{background:#F97316}
.cart-panel{position:fixed;right:-420px;top:0;width:420px;height:100vh;background:#fff;box-shadow:-4px 0 24px rgba(0,0,0,0.12);z-index:300;transition:right 0.3s;display:flex;flex-direction:column}
.cart-panel.open{right:0}
.cart-header{padding:1.25rem 1.5rem;border-bottom:1px solid #E5E7EB;display:flex;justify-content:space-between;align-items:center}
.cart-header h2{font-size:18px;font-weight:700}
.close-cart{background:none;border:none;font-size:22px;cursor:pointer;color:#6B7280}
.cart-items{flex:1;overflow-y:auto;padding:1rem 1.5rem}
.cart-item{display:flex;gap:12px;padding:1rem 0;border-bottom:1px solid #F3F4F6}
.cart-item-img{font-size:36px;width:60px;height:60px;background:#F9FAFB;border-radius:10px;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.cart-item-name{font-size:14px;font-weight:600;color:#111827;margin-bottom:4px}
.cart-item-price{font-size:14px;color:#F97316;font-weight:700}
.qty-control{display:flex;align-items:center;gap:8px;margin-top:8px}
.qty-btn{width:24px;height:24px;border:1px solid #E5E7EB;background:#F9FAFB;border-radius:6px;cursor:pointer;font-size:14px;display:flex;align-items:center;justify-content:center;font-weight:700}
.qty-num{font-size:14px;font-weight:600;min-width:20px;text-align:center}
.remove-btn{margin-left:auto;color:#EF4444;font-size:12px;cursor:pointer;background:none;border:none;font-family:inherit}
.cart-footer{padding:1.5rem;border-top:1px solid #E5E7EB}
.cart-total{display:flex;justify-content:space-between;font-size:18px;font-weight:700;margin-bottom:1rem}
.checkout-btn{width:100%;background:#F97316;color:#fff;border:none;padding:14px;border-radius:10px;font-size:16px;font-weight:700;cursor:pointer}
.empty-cart{text-align:center;padding:3rem 1rem;color:#9CA3AF}
.overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,0.4);z-index:200}
.overlay.open{display:block}
.toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%) translateY(80px);background:#111827;color:#fff;padding:12px 24px;border-radius:10px;font-size:14px;font-weight:500;transition:transform 0.3s;z-index:400}
.toast.show{transform:translateX(-50%) translateY(0)}
@media(max-width:600px){.hero-img{display:none}.hero-banner{padding:2rem 1.25rem}.products-wrap{padding:1.25rem}.products-grid{grid-template-columns:repeat(2,1fr);gap:0.75rem}.cart-panel{width:100%}}
</style>
</head>
<body>

<nav>
  <div class="nav-logo">Shop<span>Cart</span></div>
  <div class="nav-links">
    <a href="#">Products</a>
    <a href="#">Deals</a>
    <a href="#">About</a>
    <button class="cart-btn" onclick="toggleCart()">🛒<span class="cart-count" id="cartCount">0</span></button>
  </div>
</nav>

<div class="hero-banner">
  <div class="hero-text">
    <h1>Shop the Latest<br><span>Tech & Lifestyle</span></h1>
    <p>Free delivery on orders above $50.<br>New arrivals every week.</p>
    <button class="shop-btn" onclick="document.querySelector('.products-wrap').scrollIntoView({behavior:'smooth'})">Shop Now →</button>
  </div>
  <div class="hero-img">🛍️</div>
</div>

<div class="category-bar" id="categoryBar"></div>

<div class="products-wrap">
  <div class="section-title" id="sectionTitle">All Products</div>
  <div class="products-grid" id="productsGrid"></div>
</div>

<div class="overlay" id="overlay" onclick="closeCart()"></div>
<div class="cart-panel" id="cartPanel">
  <div class="cart-header"><h2>🛒 Your Cart</h2><button class="close-cart" onclick="closeCart()">✕</button></div>
  <div class="cart-items" id="cartItems"></div>
  <div class="cart-footer" id="cartFooter"></div>
</div>

<div class="toast" id="toast"></div>

<script>
const products=[
  {id:1,name:'Wireless Noise-Cancelling Headphones',cat:'Electronics',price:89,old:129,emoji:'🎧',bg:'#EFF6FF',badge:'Sale'},
  {id:2,name:'Mechanical Keyboard RGB',cat:'Electronics',price:65,old:null,emoji:'⌨️',bg:'#F0FDF4',badge:'New'},
  {id:3,name:'Minimalist Leather Wallet',cat:'Accessories',price:28,old:45,emoji:'👜',bg:'#FFF7ED',badge:'Sale'},
  {id:4,name:'Portable Phone Stand',cat:'Accessories',price:15,old:null,emoji:'📱',bg:'#FDF4FF',badge:null},
  {id:5,name:'Smart Water Bottle 750ml',cat:'Lifestyle',price:34,old:null,emoji:'🧴',bg:'#ECFDF5',badge:'New'},
  {id:6,name:'USB-C Hub 7-in-1',cat:'Electronics',price:42,old:60,emoji:'🔌',bg:'#EFF6FF',badge:'Sale'},
  {id:7,name:'Canvas Backpack 25L',cat:'Bags',price:55,old:null,emoji:'🎒',bg:'#FFFBEB',badge:null},
  {id:8,name:'Desk Plant — Succulent Set',cat:'Lifestyle',price:22,old:null,emoji:'🌵',bg:'#F0FDF4',badge:'New'},
];

const cats=['All','Electronics','Accessories','Lifestyle','Bags'];
let activecat='All';
let cart=[];

function renderCats(){
  const bar=document.getElementById('categoryBar');
  bar.innerHTML=cats.map(c=>`<button class="cat-btn ${c===activecat?'active':''}" onclick="setcat('${c}')">${c}</button>`).join('');
}

function setcat(c){activecat=c;renderCats();renderProducts();}

function renderProducts(){
  const list=activecat==='All'?products:products.filter(p=>p.cat===activecat);
  document.getElementById('sectionTitle').textContent=activecat==='All'?'All Products':activecat;
  document.getElementById('productsGrid').innerHTML=list.map(p=>`
    <div class="product-card">
      <div class="product-img" style="background:${p.bg}">
        ${p.badge?`<span class="badge ${p.badge==='Sale'?'badge-sale':'badge-new'}">${p.badge}</span>`:''}
        ${p.emoji}
      </div>
      <div class="product-info">
        <div class="product-name">${p.name}</div>
        <div class="product-cat">${p.cat}</div>
        <div class="product-price-row">
          <span class="price">$${p.price}</span>
          ${p.old?`<span class="old-price">$${p.old}</span>`:''}
        </div>
        <div class="stars">★★★★${p.id%3===0?'☆':'★'} (${20+p.id*7})</div>
        <button class="add-to-cart" onclick="addToCart(${p.id})">Add to Cart</button>
      </div>
    </div>`).join('');
}

function addToCart(id){
  const p=products.find(x=>x.id===id);
  const existing=cart.find(x=>x.id===id);
  if(existing)existing.qty++;
  else cart.push({...p,qty:1});
  updateCartCount();
  showToast(`✓ ${p.name.split(' ').slice(0,3).join(' ')} added!`);
  renderCartItems();
}

function updateCartCount(){document.getElementById('cartCount').textContent=cart.reduce((a,b)=>a+b.qty,0);}

function renderCartItems(){
  const el=document.getElementById('cartItems');
  const footer=document.getElementById('cartFooter');
  if(cart.length===0){
    el.innerHTML='<div class="empty-cart"><div style="font-size:48px;margin-bottom:1rem">🛒</div><p>Your cart is empty</p></div>';
    footer.innerHTML='';return;
  }
  el.innerHTML=cart.map(item=>`
    <div class="cart-item">
      <div class="cart-item-img">${item.emoji}</div>
      <div style="flex:1">
        <div class="cart-item-name">${item.name}</div>
        <div class="cart-item-price">$${item.price}</div>
        <div class="qty-control">
          <button class="qty-btn" onclick="changeQty(${item.id},-1)">−</button>
          <span class="qty-num">${item.qty}</span>
          <button class="qty-btn" onclick="changeQty(${item.id},1)">+</button>
          <button class="remove-btn" onclick="removeItem(${item.id})">Remove</button>
        </div>
      </div>
    </div>`).join('');
  const total=cart.reduce((a,b)=>a+(b.price*b.qty),0);
  footer.innerHTML=`
    <div class="cart-total"><span>Total</span><span>$${total.toFixed(2)}</span></div>
    <button class="checkout-btn" onclick="checkout()">Proceed to Checkout →</button>`;
}

function changeQty(id,delta){
  const item=cart.find(x=>x.id===id);
  item.qty+=delta;
  if(item.qty<=0)cart=cart.filter(x=>x.id!==id);
  updateCartCount();renderCartItems();
}
function removeItem(id){cart=cart.filter(x=>x.id!==id);updateCartCount();renderCartItems();}
function toggleCart(){document.getElementById('cartPanel').classList.toggle('open');document.getElementById('overlay').classList.toggle('open');renderCartItems();}
function closeCart(){document.getElementById('cartPanel').classList.remove('open');document.getElementById('overlay').classList.remove('open');}
function checkout(){showToast('✅ Order placed! Thank you for shopping.');cart=[];updateCartCount();renderCartItems();closeCart();}

function showToast(msg){
  const t=document.getElementById('toast');
  t.textContent=msg;t.classList.add('show');
  setTimeout(()=>t.classList.remove('show'),2800);
}

renderCats();renderProducts();
</script>
</body>
</html>
