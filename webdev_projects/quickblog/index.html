<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>QuickBlog — Content Management System</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Inter',sans-serif;background:#FAFAFA;color:#111827;font-size:14px;min-height:100vh}
nav{background:#fff;border-bottom:1px solid #E5E7EB;padding:0 1.5rem;height:60px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:100}
.logo{font-weight:800;font-size:20px;display:flex;align-items:center;gap:8px}
.logo span{background:linear-gradient(135deg,#7C3AED,#DB2777);-webkit-background-clip:text;-webkit-text-fill-color:transparent}
.logo-dot{width:10px;height:10px;background:linear-gradient(135deg,#7C3AED,#DB2777);border-radius:50%}
.nav-right{display:flex;align-items:center;gap:10px}
.tab-btn{background:none;border:none;padding:7px 16px;border-radius:8px;font-size:13px;font-weight:500;cursor:pointer;color:#6B7280;transition:all 0.2s;font-family:inherit}
.tab-btn.active{background:#F3F4F6;color:#111827;font-weight:600}
.write-btn{background:linear-gradient(135deg,#7C3AED,#DB2777);color:#fff;border:none;padding:8px 18px;border-radius:8px;font-size:13px;font-weight:600;cursor:pointer}
/* BLOG VIEW */
#blogView{max-width:1100px;margin:0 auto;padding:2rem}
.blog-hero{background:linear-gradient(135deg,#7C3AED,#DB2777);border-radius:16px;padding:2.5rem;color:#fff;margin-bottom:2rem;display:flex;justify-content:space-between;align-items:center}
.blog-hero h1{font-size:28px;font-weight:800;margin-bottom:6px}
.blog-hero p{opacity:0.8;font-size:15px}
.hero-stats{display:flex;gap:2rem;text-align:center}
.hs-num{font-size:24px;font-weight:800}
.hs-label{font-size:11px;opacity:0.7}
.filter-row{display:flex;gap:8px;margin-bottom:1.5rem;flex-wrap:wrap;align-items:center}
.cat-pill{background:#F3F4F6;color:#374151;border:none;padding:6px 16px;border-radius:20px;font-size:12px;font-weight:500;cursor:pointer;transition:all 0.2s;font-family:inherit}
.cat-pill.active,.cat-pill:hover{background:#7C3AED;color:#fff}
.search-input{margin-left:auto;border:1px solid #E5E7EB;border-radius:8px;padding:7px 14px;font-size:13px;outline:none;width:200px;transition:border-color 0.2s}
.search-input:focus{border-color:#7C3AED}
.posts-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:1.25rem}
.post-card{background:#fff;border:1px solid #E5E7EB;border-radius:14px;overflow:hidden;transition:all 0.2s;cursor:pointer}
.post-card:hover{box-shadow:0 8px 24px rgba(0,0,0,0.08);transform:translateY(-3px)}
.post-thumb{height:150px;display:flex;align-items:center;justify-content:center;font-size:56px;position:relative}
.post-cat-badge{position:absolute;bottom:10px;left:10px;font-size:11px;font-weight:600;padding:3px 10px;border-radius:20px;color:#fff}
.post-body{padding:1rem}
.post-title{font-size:14px;font-weight:700;color:#111827;margin-bottom:6px;line-height:1.4}
.post-excerpt{font-size:12px;color:#6B7280;line-height:1.6;margin-bottom:10px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.post-meta{display:flex;align-items:center;justify-content:space-between}
.post-author{font-size:11px;color:#9CA3AF;display:flex;align-items:center;gap:5px}
.author-dot{width:20px;height:20px;border-radius:50%;background:linear-gradient(135deg,#7C3AED,#DB2777);display:flex;align-items:center;justify-content:center;font-size:9px;font-weight:700;color:#fff}
.post-stats{font-size:11px;color:#9CA3AF;display:flex;gap:8px}
/* ARTICLE VIEW */
#articleView{display:none;max-width:720px;margin:0 auto;padding:2rem}
.article-back{display:inline-flex;align-items:center;gap:6px;color:#7C3AED;font-size:13px;font-weight:500;cursor:pointer;margin-bottom:1.5rem;background:none;border:none;font-family:inherit}
.article-cat{display:inline-block;font-size:11px;font-weight:700;padding:4px 12px;border-radius:20px;color:#fff;margin-bottom:1rem}
.article-title{font-size:30px;font-weight:800;color:#111827;line-height:1.25;margin-bottom:1rem}
.article-meta{display:flex;align-items:center;gap:16px;margin-bottom:2rem;padding-bottom:1.5rem;border-bottom:1px solid #F3F4F6}
.article-author{display:flex;align-items:center;gap:8px}
.article-author-img{width:36px;height:36px;border-radius:50%;background:linear-gradient(135deg,#7C3AED,#DB2777);display:flex;align-items:center;justify-content:center;font-size:14px;font-weight:700;color:#fff}
.article-author-name{font-size:13px;font-weight:600;color:#111827}
.article-date{font-size:12px;color:#9CA3AF}
.article-thumb{width:100%;height:280px;border-radius:12px;display:flex;align-items:center;justify-content:center;font-size:80px;margin-bottom:2rem}
.article-body{font-size:15px;line-height:1.8;color:#374151}
.article-body h2{font-size:20px;font-weight:700;color:#111827;margin:1.5rem 0 0.75rem}
.article-body p{margin-bottom:1rem}
.article-body code{background:#F3F4F6;padding:2px 6px;border-radius:4px;font-size:13px;color:#7C3AED}
.article-body ul{margin:0.75rem 0 1rem 1.5rem}
.article-body ul li{margin-bottom:4px}
.article-tags{display:flex;flex-wrap:wrap;gap:6px;margin-top:2rem;padding-top:1.5rem;border-bottom:1px solid #F3F4F6;margin-bottom:2rem}
.a-tag{background:#F3F4F6;color:#374151;font-size:12px;padding:4px 12px;border-radius:20px}
.comment-section h3{font-size:16px;font-weight:700;margin-bottom:1.25rem}
.comment{display:flex;gap:10px;margin-bottom:1.25rem}
.comment-avatar{width:34px;height:34px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:700;color:#fff;flex-shrink:0}
.comment-bubble{background:#F9FAFB;border-radius:10px;padding:0.875rem;flex:1}
.comment-author{font-size:13px;font-weight:600;color:#111827;margin-bottom:3px}
.comment-text{font-size:13px;color:#6B7280;line-height:1.5}
.comment-input-row{display:flex;gap:8px;margin-top:1rem}
.comment-input-row input{flex:1;border:1px solid #E5E7EB;border-radius:8px;padding:9px 14px;font-size:13px;outline:none;transition:border-color 0.2s}
.comment-input-row input:focus{border-color:#7C3AED}
.comment-submit{background:#7C3AED;color:#fff;border:none;padding:9px 18px;border-radius:8px;font-size:13px;font-weight:600;cursor:pointer}
/* WRITE VIEW */
#writeView{display:none;max-width:800px;margin:0 auto;padding:2rem}
.editor-wrap{background:#fff;border:1px solid #E5E7EB;border-radius:14px;overflow:hidden}
.editor-toolbar{padding:0.875rem 1rem;border-bottom:1px solid #F3F4F6;display:flex;gap:6px;flex-wrap:wrap}
.tool-btn{background:#F3F4F6;border:none;padding:5px 12px;border-radius:6px;font-size:12px;font-weight:600;cursor:pointer;color:#374151;transition:background 0.2s}
.tool-btn:hover{background:#E5E7EB}
.editor-title{width:100%;border:none;outline:none;font-size:26px;font-weight:700;color:#111827;padding:1.25rem 1.25rem 0.5rem;font-family:inherit}
.editor-subtitle{width:100%;border:none;outline:none;font-size:15px;color:#9CA3AF;padding:0 1.25rem 0.75rem;font-family:inherit;border-bottom:1px solid #F3F4F6}
.editor-body{width:100%;border:none;outline:none;font-size:15px;color:#374151;padding:1rem 1.25rem;font-family:inherit;line-height:1.8;min-height:300px;resize:none}
.publish-row{display:flex;gap:10px;align-items:center;margin-top:1.25rem;flex-wrap:wrap}
.pub-select{border:1px solid #E5E7EB;border-radius:8px;padding:9px 14px;font-size:13px;outline:none;color:#374151;cursor:pointer}
.pub-btn{background:linear-gradient(135deg,#7C3AED,#DB2777);color:#fff;border:none;padding:10px 28px;border-radius:8px;font-size:14px;font-weight:700;cursor:pointer}
.pub-success{display:none;background:#F0FDF4;border:1px solid #BBF7D0;border-radius:8px;padding:10px 16px;font-size:13px;color:#166534;font-weight:500}
@media(max-width:700px){.posts-grid{grid-template-columns:1fr}.blog-hero{flex-direction:column;gap:1.5rem}.hero-stats{justify-content:center}}
</style>
</head>
<body>
<nav>
  <div class="logo"><div class="logo-dot"></div><span>QuickBlog</span></div>
  <div class="nav-right">
    <button class="tab-btn active" onclick="showView('blog')">📖 Blog</button>
    <button class="tab-btn" onclick="showView('write')">✏️ Write</button>
    <button class="write-btn" onclick="showView('write')">+ New Post</button>
  </div>
</nav>

<div id="blogView">
  <div class="blog-hero">
    <div><h1>QuickBlog CMS</h1><p>Create, publish & manage blog content with ease.</p></div>
    <div class="hero-stats">
      <div><div class="hs-num" id="totalPosts">0</div><div class="hs-label">Posts</div></div>
      <div><div class="hs-num" id="totalViews">0</div><div class="hs-label">Total Views</div></div>
      <div><div class="hs-num" id="totalCats">0</div><div class="hs-label">Categories</div></div>
    </div>
  </div>
  <div class="filter-row" id="filterRow"></div>
  <div class="posts-grid" id="postsGrid"></div>
</div>

<div id="articleView">
  <button class="article-back" onclick="showView('blog')">← Back to Blog</button>
  <div id="articleContent"></div>
</div>

<div id="writeView">
  <div style="margin-bottom:1.25rem"><div style="font-size:20px;font-weight:800;margin-bottom:4px">Write a New Post</div><div style="font-size:13px;color:#9CA3AF">Your post will be published instantly to the blog</div></div>
  <div class="editor-wrap">
    <div class="editor-toolbar">
      <button class="tool-btn">B</button><button class="tool-btn"><i>I</i></button><button class="tool-btn">H1</button><button class="tool-btn">H2</button><button class="tool-btn">• List</button><button class="tool-btn">`` Code</button><button class="tool-btn">🔗 Link</button><button class="tool-btn">🖼 Image</button>
    </div>
    <input type="text" class="editor-title" id="newTitle" placeholder="Your post title...">
    <input type="text" class="editor-subtitle" id="newSubtitle" placeholder="Short excerpt / subtitle...">
    <textarea class="editor-body" id="newBody" placeholder="Write your post content here..."></textarea>
  </div>
  <div class="publish-row">
    <select class="pub-select" id="newCat">
      <option value="Tech">💻 Tech</option><option value="React">⚛️ React</option><option value="Node.js">🟢 Node.js</option><option value="SQA">🧪 SQA</option><option value="Career">🚀 Career</option>
    </select>
    <button class="pub-btn" onclick="publishPost()">Publish Post →</button>
    <div class="pub-success" id="pubSuccess">✅ Published! Check the blog.</div>
  </div>
</div>

<script>
let posts=[
  {id:1,title:'Building a REST API with Node.js and Express in 2025',excerpt:'A practical guide to structuring your backend with proper routing, middleware, and error handling for production apps.',cat:'Node.js',emoji:'🟢',bg:'#F0FDF4',color:'#16A34A',author:'Noreen Naqvi',date:'Jun 4, 2025',views:1240,readTime:'8 min',tags:['Node.js','Express','REST API','Backend'],comments:[{author:'Ali R.',color:'#3B82F6',text:'Really clear explanation! Helped me understand middleware properly.'}],body:`<h2>Why REST APIs with Express?</h2><p>Express.js remains the most popular Node.js framework in 2025 for good reason — it's minimal, flexible, and has a massive ecosystem. In this guide we'll build a production-ready REST API from scratch.</p><h2>Setting Up Your Project</h2><p>Start by initializing your project and installing dependencies:</p><p><code>npm init -y && npm install express mongoose dotenv cors</code></p><h2>Structuring Your Routes</h2><p>A clean folder structure is essential for maintainable APIs. Separate your routes, controllers, models, and middleware into dedicated folders.</p><ul><li>routes/ — URL definitions</li><li>controllers/ — Business logic</li><li>models/ — Mongoose schemas</li><li>middleware/ — Auth, validation, error handling</li></ul><h2>Error Handling Done Right</h2><p>Always use a centralized error handling middleware in Express. This prevents code duplication and gives your API consistent error responses.</p>`},
  {id:2,title:'SQA Best Practices: Writing Test Cases That Actually Work',excerpt:'How to write effective test cases that catch real bugs, not just check obvious happy paths.',cat:'SQA',emoji:'🧪',bg:'#FFF7ED',color:'#D97706',author:'Noreen Naqvi',date:'Jun 2, 2025',views:876,readTime:'6 min',tags:['SQA','Testing','QA','JIRA'],comments:[{author:'Sara K.',color:'#8B5CF6',text:'The negative test case section was exactly what I needed!'}],body:`<h2>Why Most Test Cases Fail to Find Bugs</h2><p>The most common mistake in QA is writing test cases that only cover the "happy path" — the expected user flow. Real bugs live in edge cases, boundary values, and error states.</p><h2>The 3 Types of Test Cases You Need</h2><ul><li><strong>Positive test cases</strong> — Does the feature work as expected?</li><li><strong>Negative test cases</strong> — What happens with invalid inputs?</li><li><strong>Boundary test cases</strong> — What happens at the edge values?</li></ul><h2>Writing a Good Test Case</h2><p>Every test case should have: a unique ID, clear preconditions, step-by-step actions, expected result, and actual result. Vague test cases lead to inconsistent execution.</p><h2>API Testing with Postman</h2><p>For backend testing, Postman collections are your best friend. Write <code>pm.test()</code> assertions to validate response codes, body structure, and response time automatically.</p>`},
  {id:3,title:'React State Management: Context API vs Redux Toolkit',excerpt:'When to use Context API and when to bring in Redux — a practical comparison for real projects.',cat:'React',emoji:'⚛️',bg:'#EFF6FF',color:'#1D4ED8',author:'Noreen Naqvi',date:'May 30, 2025',views:2100,readTime:'10 min',tags:['React','Redux','State Management','Frontend'],comments:[{author:'Hamza T.',color:'#10B981',text:'Finally a clear comparison! Going with Redux Toolkit for my next project.'},{author:'Maryam F.',color:'#F59E0B',text:'Context API has been enough for my small apps, good to know the limits.'}],body:`<h2>The State Management Dilemma</h2><p>Every React developer faces this question at some point: do I need Redux, or will Context API be enough? The honest answer depends on your app's complexity and team size.</p><h2>Context API — Best For</h2><ul><li>Small to medium apps with minimal global state</li><li>Sharing theme, auth status, or language settings</li><li>Teams that want to avoid additional dependencies</li></ul><h2>Redux Toolkit — Best For</h2><ul><li>Large apps with complex state interactions</li><li>Frequent state updates that affect many components</li><li>Teams that need powerful dev tools and time-travel debugging</li></ul><h2>My Recommendation</h2><p>Start with Context API. If you notice performance issues or state logic getting complex, migrate to Redux Toolkit. The <code>createSlice</code> API makes it much less boilerplate-heavy than old Redux.</p>`},
  {id:4,title:'From Student to Junior Dev: My First Year at a Tech Company',excerpt:'Honest lessons from my first year working as a junior developer — what nobody tells you before you start.',cat:'Career',emoji:'🚀',bg:'#FAF5FF',color:'#7C3AED',author:'Noreen Naqvi',date:'May 25, 2025',views:3400,readTime:'7 min',tags:['Career','Junior Dev','Tips','Personal'],comments:[{author:'Zainab A.',color:'#EC4899',text:'This is so relatable! The part about code reviews hit home.'},{author:'Usman M.',color:'#3B82F6',text:'Thank you for being so honest — most people only share success stories.'}],body:`<h2>The First Week Feeling</h2><p>Nothing prepares you for the first week at a real tech company. You'll feel like everyone around you knows ten times more than you. That's normal, and it passes.</p><h2>Lesson 1: Ask Questions Early</h2><p>The biggest mistake junior devs make is staying stuck for hours trying to figure something out alone. Ask after 30 minutes of being stuck — your seniors expect it and respect it.</p><h2>Lesson 2: Git Workflow is Not Optional</h2><p>In university, Git means push to main and hope for the best. At work, you'll deal with feature branches, pull requests, merge conflicts, and code reviews. Learn proper Git flow before your first day.</p><h2>Lesson 3: QA Is Your Friend</h2><p>I started as both a developer and QA, and it made me a significantly better coder. Understanding how testers think helps you write code with fewer bugs from the start.</p>`},
];

const cats=['All','Tech','React','Node.js','SQA','Career'];
let activeCat='All';

function showView(v){
  document.getElementById('blogView').style.display=v==='blog'?'block':'none';
  document.getElementById('articleView').style.display=v==='article'?'block':'none';
  document.getElementById('writeView').style.display=v==='write'?'block':'none';
  document.querySelectorAll('.tab-btn').forEach(b=>b.classList.remove('active'));
  if(v==='blog')document.querySelectorAll('.tab-btn')[0].classList.add('active');
  if(v==='write')document.querySelectorAll('.tab-btn')[1].classList.add('active');
  if(v==='blog'){renderPosts();renderStats();}
}

function renderStats(){
  document.getElementById('totalPosts').textContent=posts.length;
  document.getElementById('totalViews').textContent=(posts.reduce((a,b)=>a+b.views,0)/1000).toFixed(1)+'k';
  document.getElementById('totalCats').textContent=new Set(posts.map(p=>p.cat)).size;
}

function renderFilters(){
  const allCats=['All',...new Set(posts.map(p=>p.cat))];
  document.getElementById('filterRow').innerHTML=allCats.map(c=>`<button class="cat-pill ${c===activeCat?'active':''}" onclick="filterCat('${c}')">${c}</button>`).join('')+`<input type="text" class="search-input" placeholder="Search posts..." oninput="searchPosts(this.value)">`;
}

function filterCat(c){activeCat=c;renderFilters();renderPosts();}
function searchPosts(q){
  const filtered=q?posts.filter(p=>p.title.toLowerCase().includes(q.toLowerCase())||p.cat.toLowerCase().includes(q.toLowerCase())):posts;
  renderPostCards(filtered);
}

function renderPosts(){
  const filtered=activeCat==='All'?posts:posts.filter(p=>p.cat===activeCat);
  renderPostCards(filtered);
}

function renderPostCards(list){
  document.getElementById('postsGrid').innerHTML=list.map(p=>`
    <div class="post-card" onclick="openPost(${p.id})">
      <div class="post-thumb" style="background:${p.bg}">
        <span class="post-cat-badge" style="background:${p.color}">${p.cat}</span>
        ${p.emoji}
      </div>
      <div class="post-body">
        <div class="post-title">${p.title}</div>
        <div class="post-excerpt">${p.excerpt}</div>
        <div class="post-meta">
          <div class="post-author"><div class="author-dot">NN</div>${p.author} · ${p.date}</div>
          <div class="post-stats"><span>👁 ${p.views.toLocaleString()}</span><span>⏱ ${p.readTime}</span></div>
        </div>
      </div>
    </div>`).join('');
}

function openPost(id){
  const p=posts.find(x=>x.id===id);
  p.views++;
  document.getElementById('articleContent').innerHTML=`
    <span class="article-cat" style="background:${p.color}">${p.cat}</span>
    <div class="article-title">${p.title}</div>
    <div class="article-meta">
      <div class="article-author">
        <div class="article-author-img">NN</div>
        <div><div class="article-author-name">${p.author}</div><div class="article-date">${p.date} · ${p.readTime} read · 👁 ${p.views.toLocaleString()} views</div></div>
      </div>
    </div>
    <div class="article-thumb" style="background:${p.bg}">${p.emoji}</div>
    <div class="article-body">${p.body}</div>
    <div class="article-tags">${p.tags.map(t=>`<span class="a-tag">#${t}</span>`).join('')}</div>
    <div class="comment-section">
      <h3>💬 ${p.comments.length} Comment${p.comments.length!==1?'s':''}</h3>
      ${p.comments.map(c=>`<div class="comment"><div class="comment-avatar" style="background:${c.color}">${c.author[0]}</div><div class="comment-bubble"><div class="comment-author">${c.author}</div><div class="comment-text">${c.text}</div></div></div>`).join('')}
      <div class="comment-input-row">
        <input type="text" id="newComment" placeholder="Add a comment...">
        <button class="comment-submit" onclick="addComment(${p.id})">Post</button>
      </div>
    </div>`;
  showView('article');
}

function addComment(id){
  const input=document.getElementById('newComment');
  const text=input.value.trim();
  if(!text)return;
  const p=posts.find(x=>x.id===id);
  const colors=['#3B82F6','#8B5CF6','#EC4899','#10B981','#F59E0B'];
  p.comments.push({author:'You',color:colors[Math.floor(Math.random()*colors.length)],text});
  openPost(id);
}

function publishPost(){
  const title=document.getElementById('newTitle').value.trim();
  const excerpt=document.getElementById('newSubtitle').value.trim();
  const body=document.getElementById('newBody').value.trim();
  const cat=document.getElementById('newCat').value;
  if(!title||!body){alert('Please add a title and content.');return;}
  const emojis={'Tech':'💡','React':'⚛️','Node.js':'🟢','SQA':'🧪','Career':'🚀'};
  const bgs={'Tech':'#F0F9FF','React':'#EFF6FF','Node.js':'#F0FDF4','SQA':'#FFF7ED','Career':'#FAF5FF'};
  const colors={'Tech':'#0369A1','React':'#1D4ED8','Node.js':'#16A34A','SQA':'#D97706','Career':'#7C3AED'};
  posts.unshift({id:Date.now(),title,excerpt:excerpt||body.slice(0,120)+'...',cat,emoji:emojis[cat],bg:bgs[cat],color:colors[cat],author:'Noreen Naqvi',date:'Just now',views:1,readTime:'3 min',tags:[cat],comments:[],body:`<p>${body.replace(/\n\n/g,'</p><p>').replace(/\n/g,'<br>')}</p>`});
  document.getElementById('newTitle').value='';document.getElementById('newSubtitle').value='';document.getElementById('newBody').value='';
  const s=document.getElementById('pubSuccess');s.style.display='block';
  setTimeout(()=>{s.style.display='none';showView('blog');},2000);
}

renderStats();renderFilters();renderPosts();
</script>
</body>
</html>
