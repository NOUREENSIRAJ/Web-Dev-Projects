<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>QuickBlog — Content Management System</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>
<nav>
  <div class="logo"><div class="logo-dot"></div><span>QuickBlog</span></div>
  <div class="nav-right">
    <button class="tab-btn active" onclick="showView('blog')">📖 Blog</button>
    <button class="tab-btn" onclick="showView('write')">✏️ Write</button>
    <button class="write-btn" onclick="showView('write')">+ New Post</button>
  </div>
</nav>

<div id="blogView">
  <div class="blog-hero">
    <div><h1>QuickBlog CMS</h1><p>Create, publish & manage blog content with ease.</p></div>
    <div class="hero-stats">
      <div><div class="hs-num" id="totalPosts">0</div><div class="hs-label">Posts</div></div>
      <div><div class="hs-num" id="totalViews">0</div><div class="hs-label">Total Views</div></div>
      <div><div class="hs-num" id="totalCats">0</div><div class="hs-label">Categories</div></div>
    </div>
  </div>
  <div class="filter-row" id="filterRow"></div>
  <div class="posts-grid" id="postsGrid"></div>
</div>

<div id="articleView">
  <button class="article-back" onclick="showView('blog')">← Back to Blog</button>
  <div id="articleContent"></div>
</div>

<div id="writeView">
  <div style="margin-bottom:1.25rem"><div style="font-size:20px;font-weight:800;margin-bottom:4px">Write a New Post</div><div style="font-size:13px;color:#9CA3AF">Your post will be published instantly to the blog</div></div>
  <div class="editor-wrap">
    <div class="editor-toolbar">
      <button class="tool-btn">B</button><button class="tool-btn"><i>I</i></button><button class="tool-btn">H1</button><button class="tool-btn">H2</button><button class="tool-btn">• List</button><button class="tool-btn">`` Code</button><button class="tool-btn">🔗 Link</button><button class="tool-btn">🖼 Image</button>
    </div>
    <input type="text" class="editor-title" id="newTitle" placeholder="Your post title...">
    <input type="text" class="editor-subtitle" id="newSubtitle" placeholder="Short excerpt / subtitle...">
    <textarea class="editor-body" id="newBody" placeholder="Write your post content here..."></textarea>
  </div>
  <div class="publish-row">
    <select class="pub-select" id="newCat">
      <option value="Tech">💻 Tech</option><option value="React">⚛️ React</option><option value="Node.js">🟢 Node.js</option><option value="SQA">🧪 SQA</option><option value="Career">🚀 Career</option>
    </select>
    <button class="pub-btn" onclick="publishPost()">Publish Post →</button>
    <div class="pub-success" id="pubSuccess">✅ Published! Check the blog.</div>
  </div>
</div>


<script src="script.js"></script>
</body>
</html>
