<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TaskFlow — Team Task Manager</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>

<nav>
  <div class="nav-logo"><div class="logo-icon">⚡</div> TaskFlow</div>
  <div class="nav-right">
    <span style="color:#64748B;font-size:13px">Noreen's Workspace</span>
    <div class="avatar">NN</div>
  </div>
</nav>

<div class="project-bar">
  <div class="proj-name">🚀 DevHire — Sprint 3</div>
  <div class="proj-tag">In Progress</div>
  <div style="margin-left:auto;display:flex;gap:8px">
    <button onclick="openAddModal()" style="background:#6366F1;color:#fff;border:none;padding:6px 14px;border-radius:8px;font-size:13px;font-weight:600;cursor:pointer">+ Add Task</button>
  </div>
</div>

<div class="board" id="board">
  <!-- columns rendered by JS -->
</div>

<div class="modal-overlay" id="modal">
  <div class="modal">
    <h3>Add New Task</h3>
    <div class="form-group"><label>Task Title</label><input type="text" id="taskTitle" placeholder="What needs to be done?"></div>
    <div class="form-group"><label>Column</label>
      <select id="taskCol">
        <option value="0">To Do</option>
        <option value="1">In Progress</option>
        <option value="2">Review</option>
        <option value="3">Done</option>
      </select>
    </div>
    <div class="form-group"><label>Priority</label>
      <select id="taskPriority">
        <option value="High">High</option>
        <option value="Medium" selected>Medium</option>
        <option value="Low">Low</option>
      </select>
    </div>
    <div class="form-group"><label>Tag</label><input type="text" id="taskTag" placeholder="e.g. Frontend, API, Bug..."></div>
    <div class="form-group"><label>Due Date</label><input type="date" id="taskDue"></div>
    <div class="modal-btns">
      <button class="btn-cancel" onclick="closeModal()">Cancel</button>
      <button class="btn-add" onclick="addTask()">Add Task ✓</button>
    </div>
  </div>
</div>


<script src="script.js"></script>
</body>
</html>
